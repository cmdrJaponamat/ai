global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 2000
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 5s

# TLS remains end-to-end.  HAProxy reads only the ClientHello SNI and never
# terminates TLS for Exchange.  Non-mail SNI stays on the existing nginx L7
# gateway.  No PROXY protocol is sent to either upstream.
frontend fe_https_shared
    bind 10.78.10.4:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend be_exchange_https if { req.ssl_sni -i mail.aurora-logistics.ru }
    default_backend be_nginx_https

backend be_exchange_https
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check connect ssl sni mail.aurora-logistics.ru
    tcp-check send GET\ /mapi/healthcheck.htm\ HTTP/1.1\r\nHost:\ mail.aurora-logistics.ru\r\nConnection:\ close\r\n\r\n
    tcp-check expect rstring HTTP/1\.[01]\ 200
    server mx3 10.78.3.62:443 check verify none
    server mx4 10.78.3.63:443 check verify none

backend be_nginx_https
    mode tcp
    option tcp-check
    server nginx 10.78.3.1:443 check check-ssl verify none

# Reserved for the future mail VIP/KSMG cutover.  They bind only HAProxy-1's
# DMZ address now; no DNS or NAT points to them in this change.
frontend fe_smtp_inbound
    bind 10.78.10.4:25
    mode tcp
    timeout client 5m
    default_backend be_exchange_smtp

backend be_exchange_smtp
    mode tcp
    balance leastconn
    option smtpchk
    timeout server 5m
    server mx3 10.78.3.62:25 check
    server mx4 10.78.3.63:25 check

frontend fe_smtp_submission
    bind 10.78.10.4:587
    mode tcp
    timeout client 5m
    default_backend be_exchange_submission

backend be_exchange_submission
    mode tcp
    balance leastconn
    option smtpchk
    timeout server 5m
    server mx3 10.78.3.62:587 check
    server mx4 10.78.3.63:587 check

frontend fe_imaps
    bind 10.78.10.4:993
    mode tcp
    timeout client 1h
    default_backend be_exchange_imaps

backend be_exchange_imaps
    mode tcp
    balance leastconn
    option tcp-check
    server mx3 10.78.3.62:993 check check-ssl verify none
    server mx4 10.78.3.63:993 check check-ssl verify none
